<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Placeholder for a before and after photo of varicose vein treatment">
  <rect width="960" height="540" fill="#eef3fa"/>

  <!-- BEFORE panel -->
  <g>
    <rect x="40" y="40" width="400" height="420" rx="14" fill="#f7fafd" stroke="#0a2a52" stroke-width="2"/>
    <rect x="40" y="40" width="120" height="34" rx="0" fill="#0a2a52"/>
    <text x="100" y="63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" letter-spacing="1">BEFORE</text>
    <!-- leg -->
    <path d="M210 110 q-16 90 -6 180 q8 60 -6 120 h70 q10 -70 4 -128 q-8 -88 8 -172 z" fill="#f2eef0" stroke="#0a2a52" stroke-width="2.5"/>
    <!-- varicose veins -->
    <path d="M212 120 q28 30 4 58 q-28 28 2 56 q28 28 -2 56 q-26 28 6 62" fill="none" stroke="#5a4a9c" stroke-width="7" stroke-linecap="round"/>
    <g stroke="#b3468a" stroke-width="2" stroke-linecap="round">
      <line x1="256" y1="250" x2="276" y2="238"/><line x1="256" y1="250" x2="278" y2="258"/>
      <line x1="256" y1="250" x2="268" y2="270"/><line x1="256" y1="250" x2="240" y2="262"/>
    </g>
  </g>

  <!-- AFTER panel -->
  <g>
    <rect x="520" y="40" width="400" height="420" rx="14" fill="#f7fafd" stroke="#0a2a52" stroke-width="2"/>
    <rect x="520" y="40" width="110" height="34" rx="0" fill="#b0894a"/>
    <text x="575" y="63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" letter-spacing="1">AFTER</text>
    <!-- clean leg -->
    <path d="M690 110 q-16 90 -6 180 q8 60 -6 120 h70 q10 -70 4 -128 q-8 -88 8 -172 z" fill="#f2eef0" stroke="#0a2a52" stroke-width="2.5"/>
    <path d="M712 120 q-6 150 2 296" fill="none" stroke="#cdd8e8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="480" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#55677a">Placeholder — replace with the clinic's before &amp; after photo</text>
</svg>
