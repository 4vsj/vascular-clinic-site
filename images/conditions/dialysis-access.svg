<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Diagram of an arm showing an arteriovenous fistula created for dialysis access">
  <rect width="400" height="240" fill="#eef3fa"/>
  <!-- arm -->
  <path d="M40 96 q80 -20 170 -6 q60 10 150 4 l0 52 q-90 6 -150 -4 q-90 -14 -170 6 z"
        fill="#f7fafd" stroke="#0a2a52" stroke-width="3"/>
  <!-- artery (blue) and vein (navy) joined = fistula -->
  <path d="M70 132 q120 -16 150 -8 q40 6 130 2" fill="none" stroke="#2f6fd0" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <path d="M70 152 q120 16 150 8 q40 -6 130 -2" fill="none" stroke="#274b86" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <!-- surgical connection point -->
  <circle cx="220" cy="142" r="16" fill="#fff" stroke="#d64545" stroke-width="3"/>
  <path d="M220 132 l0 20 M210 142 l20 0" stroke="#d64545" stroke-width="3" stroke-linecap="round"/>
  <text x="220" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#d64545" font-weight="700">Artery joined to vein (fistula)</text>
</svg>
